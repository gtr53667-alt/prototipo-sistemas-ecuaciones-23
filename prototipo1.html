<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototipo: Variables y Sistemas Lineales</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Modela el Sistema Lineal</h1>
    <p id="scenario" class="scenario"></p>

    <div class="step">
      <label for="varX">¿Qué representa <strong>x</strong>?</label>
      <select id="varX"></select>
    </div>

    <div class="step">
      <label for="varY">¿Qué representa <strong>y</strong>?</label>
      <select id="varY"></select>
    </div>

    <div class="step equations">
      <p>Construye las dos ecuaciones:</p>
      <div class="eq-row">
        <input id="a1" type="number" class="coef" aria-label="coeficiente a1" />
        <span>x +</span>
        <input id="b1" type="number" class="coef" aria-label="coeficiente b1" />
        <span>y =</span>
        <input id="c1" type="number" class="coef" aria-label="resultado c1" />
      </div>
      <div class="eq-row">
        <input id="a2" type="number" class="coef" aria-label="coeficiente a2" />
        <span>x +</span>
        <input id="b2" type="number" class="coef" aria-label="coeficiente b2" />
        <span>y =</span>
        <input id="c2" type="number" class="coef" aria-label="resultado c2" />
      </div>
    </div>

    <div class="actions">
      <button id="check-btn">Comprobar modelo</button>
      <button id="next-btn" type="button">Siguiente caso</button>
    </div>

    <p id="feedback" class="feedback"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
